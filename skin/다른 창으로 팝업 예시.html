		<!-- 공지 팝업 창 영역 -->
		<div id="notice-popup" style="display: none;"></div>
		
		<script>
		    document.addEventListener("DOMContentLoaded", async function() {
		        // 깃허브 캐시 방지용 타임스탬프 추가
		        const noticeUrl = 'pop-up.html?v=' + new Date().getTime(); 
		
		        try {
		            // 1. 실제로 pop-up.html 파일이 있는지 서버에 먼저 물어봅니다.
		            const response = await fetch(noticeUrl);
		            
		            if (response.ok) {
		                // 2. 파일이 진짜로 존재할 때만 브라우저 새 창(팝업)을 강제로 엽니다.
		                // 크기는 가로 500px, 세로 550px로 지정했습니다.
		                window.open(
		                    'pop-up.html', 
		                    'MabinogiMobileNotice', 
		                    'width=500, height=550, top=100, left=100, scrollbars=yes, resizable=no'
		                );
		            } else {
		                console.log("pop-up.html 파일이 없어 팝업창을 열지 않습니다.");
		            }
		        } catch (error) {
		            console.error("팝업 체크 중 오류 발생:", error);
		        }
		    });
		</script>
